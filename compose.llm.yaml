# LLM consumers for MessyDesk's local compose. Use as an extra file; paths are relative to
# MessyDesk/local, the project directory of the first file:
#
#   cd MessyDesk/local
#   podman-compose -f compose.yaml -f ../../MD-llm/compose.llm.yaml --profile llm up -d
#
# Profile llm: the Ollama consumer and an Ollama server (CPU; see the GPU note below). Pull a model
# once: podman exec messydesk_ollama_1 ollama pull gemma3:4b
# Profile llm-cloud: OpenAI, Azure OpenAI and Gemini consumers; set their keys in .env and the
# Azure resource URL in providers/azure.json.

services:

  ollama:
    profiles: [llm]
    image: docker.io/ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Ollama silently drops text past its context; keep max_input_tokens in providers/ollama.json under this.
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama-models:/root/.ollama:Z
    # GPU (NVIDIA, podman with the CDI spec generated by nvidia-ctk):
    # devices:
    #   - nvidia.com/gpu=all

  consumer-llm-ollama:
    profiles: [llm]
    image: localhost/messydesk/md-consumer:local
    build: ../../MD-consumers
    restart: unless-stopped
    depends_on: [backend, ollama]
    environment: &llm-env
      MD_URL: http://backend:8200
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
      CONFIG_JSON_PATH: /llm/providers/ollama.json
      # The base_url in the file is for running on the host.
      DEV_URL: http://ollama:11434/v1
    volumes:
      - ../../MD-llm:/llm:ro,z
    tmpfs:
      - /src/data:mode=1777

  consumer-llm-openai:
    profiles: [llm-cloud]
    image: localhost/messydesk/md-consumer:local
    restart: unless-stopped
    depends_on: [backend]
    environment:
      <<: *llm-env
      CONFIG_JSON_PATH: /llm/providers/openai.json
      DEV_URL: ""
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ../../MD-llm:/llm:ro,z
    tmpfs:
      - /src/data:mode=1777

  consumer-llm-azure:
    profiles: [llm-cloud]
    image: localhost/messydesk/md-consumer:local
    restart: unless-stopped
    depends_on: [backend]
    environment:
      <<: *llm-env
      CONFIG_JSON_PATH: /llm/providers/azure.json
      DEV_URL: ""
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
    volumes:
      - ../../MD-llm:/llm:ro,z
    tmpfs:
      - /src/data:mode=1777

  consumer-llm-gemini:
    profiles: [llm-cloud]
    image: localhost/messydesk/md-consumer:local
    restart: unless-stopped
    depends_on: [backend]
    environment:
      <<: *llm-env
      CONFIG_JSON_PATH: /llm/providers/gemini.json
      DEV_URL: ""
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      - ../../MD-llm:/llm:ro,z
    tmpfs:
      - /src/data:mode=1777

volumes:
  ollama-models:
